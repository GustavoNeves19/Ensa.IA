[project]
name = "ensaia"
version = "0.1.0"
description = "Análise e otimização de experimentos químicos (DOE) em Python, com interpretação por LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Gabriel Henrique Lemos de Athayde" },
    { name = "Gustavo Neves da Paz Rafael" },
]
keywords = ["doe", "quimiometria", "design-of-experiments", "anova", "desirability"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "openpyxl>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Camada de LLM separada de propósito: o núcleo determinístico tem que
# instalar e rodar sem nada disso. `pip install ensaia` (sem extras) instala um
# pacote que faz DOE completo, offline.
#
# A camada fala HTTP direto (API compatível com OpenAI) via httpx e monta os
# prompts com Jinja2; sem LangChain em produção. Ver ADR 0006.
llm = [
    "httpx>=0.27",
    "jinja2>=3.1",
]
# LangChain só como extra opcional, para a comparação técnica da monografia
# (ADR 0006): se usado, deve produzir texto equivalente ao do adaptador próprio.
langchain = [
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
]
# Interface web (spec seção 7.3): NiceGUI roda sobre FastAPI, o que permite um
# único processo com a UI e o servidor MCP. Já traz FastAPI, Uvicorn, Pydantic,
# Jinja2 e o ECharts — por isso não entram plotly nem streamlit (ver ADR 0011).
ui = [
    "nicegui>=3.1",
]
# Relatório PDF padronizado (spec §13): fpdf2 monta o PDF, matplotlib gera os
# gráficos em memória (backend não interativo). Extra à parte: o núcleo e a
# camada de IA não dependem de nada disso.
report = [
    "fpdf2>=2.7",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-PyYAML>=6.0",
    # A camada de IA (extra [llm]) é exercida pelos testes, então entra aqui.
    "httpx>=0.27",
    "jinja2>=3.1",
    # Idem a camada de relatório (extra [report]).
    "fpdf2>=2.7",
    "matplotlib>=3.8",
    # Idem a interface web (extra [ui]): os testes do processo único a exercem.
    "nicegui>=3.1",
    # Oráculo de teste: o núcleo é conferido contra o statsmodels (ajuste e
    # ANOVA Tipo II); statsmodels e pandas NÃO entram em produção. ADRs 0007/0008.
    "statsmodels>=0.14",
    "pandas>=2.2",
]

[project.scripts]
ensaia-validar = "ensaia.validation.runner:main"
ensaia-ui = "ensaia.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ensaia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "llm: testes que chamam a API de um modelo de linguagem (custam dinheiro e exigem rede)",
    "lento: testes que levam mais de alguns segundos",
]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    # Nomes de identificadores em português são intencionais neste projeto:
    # a banca e a orientadora leem o código. Ver README, seção "Idioma".
    "N999",
    # Notação matemática consagrada: a matriz de modelo é X e o vetor de
    # resposta é y em toda a literatura de regressão. Renomear para
    # "matriz_x" prejudicaria a leitura de quem confere a estatística.
    "N803",
    # Sinais tipográficos (×, ², −, α) são usados de propósito: em docstrings e
    # comentários (RUF002/RUF003) e também em strings que vão renderizadas — o
    # rótulo "Nível de significância (α)" sai assim no relatório PDF (RUF001).
    "RUF001",
    "RUF002",
    "RUF003",
    # Exceções nomeadas em português com o prefixo "Erro" (ErroDeConexao), e não
    # com o sufixo inglês "Error" — mesma razão de N803/N999: o código é lido
    # pela banca e pela orientadora em português.
    "N818",
]

[tool.mypy]
python_version = "3.11"
files = ["src/ensaia"]
strict = true
# scipy e openpyxl não distribuem stubs de tipo completos.
[[tool.mypy.overrides]]
module = ["scipy.*", "openpyxl.*"]
ignore_missing_imports = true
