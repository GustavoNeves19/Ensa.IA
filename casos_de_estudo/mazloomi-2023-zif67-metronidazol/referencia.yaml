# Valores publicados no artigo original e transcritos das Tabelas 2, 3 e 4.
# Cada campo aponta para sua procedencia em fonte.md. Valores nao publicados
# ficam null, nunca sao inferidos para aparentar uma validacao completa.

caso: mazloomi-2023-zif67-metronidazol
tipo_planejamento: box_behnken

fatores:
  dose_adsorvente:
    minimo: 0.25
    maximo: 1.0
    unidade: "g/L"
  tempo_mistura:
    minimo: 15.0
    maximo: 60.0
    unidade: "min"
  ph:
    minimo: 4.0
    maximo: 10.0
    unidade: ""

escala_coeficientes: codificada
grandeza_reportada: coeficiente

respostas:
  remocao_mnz:
    coeficientes:
      Intercepto: 92.93
      dose_adsorvente: 9.45
      tempo_mistura: 6.36
      ph: 6.96
      dose_adsorvente:tempo_mistura: 3.03
      dose_adsorvente:ph: 0.925
      tempo_mistura:ph: -2.90
      dose_adsorvente^2: -8.42
      tempo_mistura^2: -5.04
      ph^2: -18.29
    significancia:
      Intercepto: null
      dose_adsorvente: true
      tempo_mistura: true
      ph: true
      dose_adsorvente:tempo_mistura: false
      dose_adsorvente:ph: false
      tempo_mistura:ph: false
      dose_adsorvente^2: true
      tempo_mistura^2: true
      ph^2: true
    r2: 0.9853
    r2_ajustado: 0.9589
    alfa_usado_no_artigo: 0.05

# O artigo informa esta condicao no resumo e na conclusao, mas nao fornece uma
# tabela separada de otimizacao com maior precisao. Por isso a resposta fica
# como o valor publicado arredondado, e a comparacao deve declarar essa
# limitacao.
condicao_otima:
  coordenadas:
    dose_adsorvente: 1.0
    tempo_mistura: 60.0
    ph: 7.0
  resposta_prevista:
    remocao_mnz: 97.0

observacoes: |
  O artigo ajusta um modelo quadratico completo em escala codificada para um
  Box-Behnken de tres fatores e 15 ensaios. A Tabela 4 traz os coeficientes;
  a Tabela 3 traz p-valores por termo, R2 e R2 ajustado. O p-valor do
  intercepto nao foi publicado e, portanto, permanece null.
