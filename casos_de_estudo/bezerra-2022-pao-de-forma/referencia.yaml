# Valores PUBLICADOS em Bezerra et al. (2022), Research, Society and
# Development 11(11), e297111133569. Procedência de cada número: fonte.md.
# Coeficientes = efeito publicado / 2 (o Statistica publica efeitos).

caso: bezerra-2022-pao-de-forma
status: rascunho   # números conferidos contra o pipeline (§4.3 a e b passam
                   # nas 8 respostas), mas falta a dupla conferência humana
tipo_planejamento: composto_central
termo_erro: erro_puro   # o Statistica testou os efeitos com o erro puro (3 centrais)

fatores:
  # A planilha está em valores codificados: -1 e +1 aqui são os próprios
  # códigos. Níveis reais (Tabela 1): extrato 2 / 8,5 / 15 %,
  # fermento 1 / 3,5 / 6 %, gordura 3 / 5,5 / 8 % (−1 / 0 / +1).
  extrato:
    minimo: -1.0
    maximo: 1.0
    unidade: "codificado"
  fermento:
    minimo: -1.0
    maximo: 1.0
    unidade: "codificado"
  gordura:
    minimo: -1.0
    maximo: 1.0
    unidade: "codificado"

escala_coeficientes: codificada
grandeza_reportada: coeficiente

