# A formulação escolhida (ensaio 12) saiu do escore total, não de uma
# otimização do modelo.
condicao_otima: null

observacoes: |
  O EnsaIA analisa até 5 respostas por vez (RNF-12): o caso usa 5 das 8
  respostas com efeitos publicados; textura, aroma e característica interna
  da crosta estão em dados.csv e são conferidas no teste unitário.
  Ver fonte.md. Resumo: matriz codificada com α exato; termo de erro = erro
  puro; o escore total (Tabelas 8 e 9) ficou de fora por inconsistência do
  próprio artigo; os modelos reduzidos (R² e ANOVAs do texto) não são
  comparados porque o artigo não diz quais termos ficaram em cada um.
