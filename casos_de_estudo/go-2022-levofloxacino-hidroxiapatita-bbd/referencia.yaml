# Fonte primaria: planilha suplementar oficial do estudo, aba ANOVA.
# O modelo publicado e 2FI, portanto nao inclui termos quadraticos.

caso: go-2022-levofloxacino-hidroxiapatita-bbd
tipo_planejamento: box_behnken

fatores:
  dose_catalisador:
    minimo: 0.5
    maximo: 1.5
    unidade: "g/L"
  concentracao_levofloxacino:
    minimo: 4.0
    maximo: 10.0
    unidade: "ppm"
  ph:
    minimo: 4.0
    maximo: 10.0
    unidade: ""

escala_coeficientes: codificada
grandeza_reportada: coeficiente

# Excecao declarada ao modelo quadratico padrao: reproduz exatamente o modelo
# selecionado e publicado no MINITAB 17.
termos_modelo:
  - Intercepto
  - dose_catalisador
  - concentracao_levofloxacino
  - ph
  - dose_catalisador:concentracao_levofloxacino
  - dose_catalisador:ph
  - concentracao_levofloxacino:ph

respostas:
  eficiencia_fotodegradacao:
    coeficientes:
      Intercepto: 53.349
      dose_catalisador: 7.025
      concentracao_levofloxacino: -7.538
      ph: 3.870
      dose_catalisador:concentracao_levofloxacino: 5.230
      dose_catalisador:ph: 7.060
      concentracao_levofloxacino:ph: 2.030
    significancia:
      Intercepto: null
      dose_catalisador: true
      concentracao_levofloxacino: true
      ph: true
      dose_catalisador:concentracao_levofloxacino: true
      dose_catalisador:ph: true
      concentracao_levofloxacino:ph: false
    r2: 0.9708
    r2_ajustado: 0.9489
    alfa_usado_no_artigo: 0.05

condicao_otima:
  # Objetivo da otimização no artigo: a condição publicada é a de máxima eficiência de fotodegradação.
  objetivos:
    eficiencia_fotodegradacao: maximizar
  coordenadas:
    dose_catalisador: 1.5
    concentracao_levofloxacino: 4.0
    ph: 10.0
  resposta_prevista:
    eficiencia_fotodegradacao: 71.59

observacoes: |
  A planilha oficial informa que o modelo de superficie de resposta e a ANOVA
  foram calculados no MINITAB 17. O modelo escolhido pelo estudo e 2FI, com
  sete parametros, e nao o quadratico completo de dez parametros de um BBD.
  A validacao deve usar exatamente termos_modelo para comparar como o mesmo
  modelo estatistico, sem atribuir ao EnsaIA diferencas causadas por selecao de
  termos distinta.
