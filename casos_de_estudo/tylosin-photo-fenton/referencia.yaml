# Valores publicados no artigo original. Transcritos via leitura assistida
# (WebFetch) do mirror PMC em 2026-10-23 — PENDENTE conferência humana dupla
# contra o PDF/HTML original antes de virar evidência final do TCC. Ver
# fonte.md para o que ainda falta conferir.

caso: tylosin-photo-fenton
status: rascunho   # roda bem (R² Δ=0,002, sig. 9/9), mas 3 coeficientes pequenos/não
                    # significativos passam de 5% de erro relativo — ver observações.
                    # Pendente conferência humana antes de contar como validado.
tipo_planejamento: composto_central

fatores:
  # minimo/maximo = níveis -1 e +1 do FATORIAL (vértices), NÃO os pontos axiais
  # -alfa/+alfa. Os coeficientes publicados estão nessa escala codificada.
  h2o2:
    minimo: 0.2
    maximo: 0.4
    unidade: "g/L"
  ph:
    minimo: 2.3
    maximo: 3.5
    unidade: ""
  fe2:
    minimo: 2.0
    maximo: 6.0
    unidade: "mg/L"

escala_coeficientes: codificada
grandeza_reportada: coeficiente

respostas:
  remocao_toc:
    coeficientes:
      Intercepto: 88.2
      h2o2: -2.2
      ph: -11.9
      fe2: 10.2
      h2o2:ph: -4.2
      h2o2:fe2: 4.4
      ph:fe2: 0.5
      h2o2^2: -0.3
      ph^2: -16.4
      fe2^2: -3.2
    significancia:
      Intercepto: null
      h2o2: true        # p = 0,038
      ph: true           # p < 0,001
      fe2: true          # p < 0,001
      h2o2:ph: true      # p = 0,005
      h2o2:fe2: true     # p = 0,005
      ph:fe2: false      # p = 0,640
      h2o2^2: false      # p = 0,758
      ph^2: true         # p < 0,001
      fe2^2: true        # p = 0,005
    r2: 0.986
    r2_ajustado: 0.973
    alfa_usado_no_artigo: 0.05

# O artigo reporta tanto o valor previsto pelo modelo (100%) quanto a
# confirmação experimental na condição ótima (97,1%) — ver observações.
condicao_otima:
  objetivos:
    remocao_toc: maximizar
  coordenadas:
    h2o2: 0.4
    ph: 2.6
    fe2: 6.0
  resposta_prevista:
    remocao_toc: 100.0

observacoes: |
  Transcrição feita por leitura assistida (ferramenta de IA lendo o mirror
  PMC https://pmc.ncbi.nlm.nih.gov/articles/PMC5456803/), não por um humano
  abrindo o PDF — ainda não passou pela dupla conferência que o
  `casos_de_estudo/README.md` exige. Antes de citar este caso como evidência
  final do capítulo de resultados, confira contra o artigo:

  - A Tabela 2 completa (20 ensaios), em especial os 6 pontos centrais
    (ensaios 15-20 na leitura: 88,15 / 88,63 / 88,93 / 88,45 / 87,85 / 88,32),
    que vieram como um intervalo numa primeira leitura e precisaram de uma
    segunda consulta para separar valor a valor.
  - A ANOVA completa (Tabela 3): SQ por termo não foi extraída, só GL, QM, F
    e p — se o §4.3 exigir SQ por termo, voltar à fonte.
  - A tabela de ANOVA mostra p(H2O2) = 0,038, no limite de α = 0,05: confirmar
    esse valor com atenção redobrada.
  - A condição ótima publicada tem confirmação experimental de 97,1% (não
    100%, que é o valor previsto pelo modelo) — o critério (d) do §4.3 deve
    comparar contra o previsto (100%), e a divergência modelo×experimento é
    do próprio artigo, não um erro do EnsaIA.
  - Os eixos axiais (-alfa/+alfa) da leitura (H2O2: 0,13/0,46; pH: 1,92/3,88;
    Fe2+: 0,73/7,26) não batem exatamente com o alfa=1,68 teórico aplicado ao
    centro/passo de cada fator (ex.: H2O2 daria 0,132/0,468) — a diferença é
    pequena e pode ser arredondamento do artigo ou dose real ajustada em
    laboratório; confirmar contra a Tabela 1/2 original antes de assumir
    erro de transcrição.
